<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nick's House - Clear Out!</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Georgia', serif; }
        #ui {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #timer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 10px;
            background: #bc8f8f;
            width: 100%;
            transition: width 0.1s linear;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.7);
            color: white;
            flex-direction: column;
            cursor: pointer;
            z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        p { font-size: 1.2rem; font-style: italic; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="status">DRAG THE BOXES OUT!</div>
        <div id="count">ITEMS LEFT: 6</div>
    </div>
    <div id="timer-bar"></div>
    <div id="overlay">
        <h1 id="overlay-title">NICK'S HOUSE</h1>
        <p id="overlay-msg">Click to start clearing the wreckage</p>
    </div>

    <!-- Import Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // Game Constants
        const GAME_DURATION = 15;
        const ITEM_COUNT = 6;
        const BOUNDARY = 9;

        // State
        let scene, camera, renderer, timerBar, statusEl, countEl;
        let items = [];
        let draggingItem = null;
        let dragOffset = new THREE.Vector3();
        let startTime = null;
        let isPlaying = false;
        let gameEnded = false;

        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 7, 10);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);
            const sunLight = new THREE.DirectionalLight(0xffffff, 2);
            sunLight.position.set(5, 10, 5);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Room
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(20, 20),
                new THREE.MeshStandardMaterial({ color: 0x666666 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const wall = new THREE.Mesh(
                new THREE.PlaneGeometry(20, 10),
                new THREE.MeshStandardMaterial({ color: 0x444444 })
            );
            wall.position.set(0, 5, -10);
            scene.add(wall);

            timerBar = document.getElementById('timer-bar');
            statusEl = document.getElementById('status');
            countEl = document.getElementById('count');

            window.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('resize', onWindowResize);

            overlay.addEventListener('click', start);

            animate();
        }

        function spawnItems() {
            items.forEach(i => scene.remove(i));
            items = [];
            const colors = [0xbc8f8f, 0xdeb887, 0xd2b48c, 0xf5f5dc];

            for (let i = 0; i < ITEM_COUNT; i++) {
                const size = 0.5 + Math.random();
                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(size, size, size),
                    new THREE.MeshStandardMaterial({ color: colors[i % colors.length] })
                );
                mesh.position.set((Math.random()-0.5)*8, size/2, (Math.random()-0.5)*8);
                mesh.castShadow = true;
                scene.add(mesh);
                items.push(mesh);
            }
            updateCount();
        }

        function start() {
            overlay.classList.add('hidden');
            spawnItems();
            startTime = performance.now();
            isPlaying = true;
            gameEnded = false;
            statusEl.innerText = "DRAG THE BOXES OUT!";
        }

        function onMouseDown(e) {
            if (!isPlaying || gameEnded) return;
            const mouse = new THREE.Vector2(
                (e.clientX / window.innerWidth) * 2 - 1,
                -(e.clientY / window.innerHeight) * 2 + 1
            );
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(items);
            if (intersects.length > 0) {
                draggingItem = intersects[0].object;
                dragOffset.copy(draggingItem.position).sub(intersects[0].point);
            }
        }

        function onMouseMove(e) {
            if (!draggingItem || !isPlaying) return;
            const mouse = new THREE.Vector2(
                (e.clientX / window.innerWidth) * 2 - 1,
                -(e.clientY / window.innerHeight) * 2 + 1
            );
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const target = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(plane, target)) {
                draggingItem.position.copy(target.add(dragOffset));
                if (Math.abs(draggingItem.position.x) > BOUNDARY || Math.abs(draggingItem.position.z) > BOUNDARY) {
                    removeCurrentItem();
                }
            }
        }

        function onMouseUp() { draggingItem = null; }

        function removeCurrentItem() {
            if (!draggingItem) return;
            scene.remove(draggingItem);
            items = items.filter(i => i !== draggingItem);
            draggingItem = null;
            updateCount();
            if (items.length === 0) win();
        }

        function updateCount() {
            countEl.innerText = `ITEMS LEFT: ${items.length}`;
        }

        function win() {
            endGame("SPICK AND SPAN", "The room is empty, as hollow as the promises of the East Egg.");
        }

        function lose() {
            endGame("CLUTTERED", "The junk remains. Some things simply cannot be packed away.");
        }

        function endGame(title, msg) {
            gameEnded = true;
            isPlaying = false;
            overlayTitle.innerText = title;
            overlayMsg.innerText = msg + " (Click to try again)";
            overlay.classList.remove('hidden');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isPlaying && !gameEnded) {
                const elapsed = (performance.now() - startTime) / 1000;
                const remaining = Math.max(0, 1 - (elapsed / GAME_DURATION));
                timerBar.style.width = (remaining * 100) + "%";
                if (elapsed >= GAME_DURATION) lose();
            }
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
